name: Update worksite data

on:
  schedule:
    # Mondays and Thursdays at 09:23 UTC (4:23 a.m. in Montréal in winter, 5:23 a.m. in summer)
    - cron: "23 9 * * 1,4"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # lets the workflow commit the new data files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas

      - name: Download, clean and merge the City's data
        run: python scripts/update_data.py

      - name: Commit the new data (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/worksites.geojson data/worksites_history.geojson data/last_updated.json
          if git diff --staged --quiet; then
            echo "No changes in the City's data."
          else
            git commit -m "Update worksite data ($(date -u +%Y-%m-%d))"
            git push
          fi
